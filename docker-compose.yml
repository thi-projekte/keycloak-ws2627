services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    # --import-realm liest beim Start alle *.json aus /opt/keycloak/data/import.
    # Existiert der Realm "terramax" bereits in der DB, wird der Import übersprungen
    # (bestehende Daten werden NICHT überschrieben).
    command: start --import-realm
    environment:
      # Datenbankanbindung
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Öffentlicher Hostname (muss zur Subdomain im Nginx PM passen)
      KC_HOSTNAME: terramax-keycloak.winfprojekt.de
      # TLS wird am Nginx PM terminiert, Keycloak läuft intern per HTTP
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Initialer Admin-Account (nur beim ersten Start ausgewertet)
      # Ab Keycloak 26 ersetzen diese Variablen KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Wird beim Realm-Import in den Platzhalter ${TERRAMAX_HELLO_WORLD_CLIENT_SECRET}
      # des Clients "terramax-hello-world" eingesetzt (der Partial Export enthält
      # das Secret nur maskiert als "**********")
      TERRAMAX_HELLO_WORLD_CLIENT_SECRET: ${TERRAMAX_HELLO_WORLD_CLIENT_SECRET}
    volumes:
      # Realm-Export (terramax) liegt direkt neben dieser Datei
      - ./terramax-realm.json:/opt/keycloak/data/import/terramax-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - intern                # erreichbar für PostgreSQL

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intern                # nur intern, kein Zugriff von außen

networks:
  nginx-proxy-manager:
    external: true            # existiert bereits auf dem Host
  intern:
    driver: bridge            # vom Stack verwaltet

volumes:
  postgres_data:              # Daten überleben Container-Neustarts
