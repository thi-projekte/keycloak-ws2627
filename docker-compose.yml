services:
  keycloak:
    # Eigenes Image mit eingebautem terramax-Realm (siehe Dockerfile)
    # <github-user-oder-org> durch euren GitHub-Namen in Kleinbuchstaben ersetzen
    image: ghcr.io/thi-projekte/terramax-keycloak:latest
    # Startbefehl kommt aus dem Image: start --optimized --import-realm
    # Existiert der Realm "terramax" bereits in der DB, wird der Import übersprungen.
    environment:
      # Datenbankanbindung (KC_DB=postgres ist bereits im Image gesetzt)
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Öffentlicher Hostname (muss zur Subdomain im Nginx PM passen)
      KC_HOSTNAME: terramax-keycloak.winfprojekt.de
      # TLS wird am Nginx PM terminiert, Keycloak läuft intern per HTTP
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Initialer Admin-Account (nur beim ersten Start ausgewertet)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Wird beim Realm-Import in den Platzhalter des Clients
      # "terramax-hello-world" eingesetzt
      TERRAMAX_HELLO_WORLD_CLIENT_SECRET: ${TERRAMAX_HELLO_WORLD_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nginx-proxy-manager   # erreichbar für den Nginx Proxy Manager
      - intern                # erreichbar für PostgreSQL

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intern   
      - databasus             # nur intern, kein Zugriff von außen

networks:
  nginx-proxy-manager:
    external: true
  databasus:
    external: true            # existiert bereits auf dem Host
  intern:
    driver: bridge            # vom Stack verwaltet

volumes:
  postgres_data:              # Daten überleben Container-Neustarts
